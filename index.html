<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Funhouse — live face filters</title>
<style>
  :root{
    --ink:#170C1B;
    --plum:#2A1430;
    --marigold:#FFB627;
    --cyan:#3DDCFF;
    --bone:#F6EFE6;
    --dim:rgba(246,239,230,.55);
    --safe-b:env(safe-area-inset-bottom, 0px);
    --safe-t:env(safe-area-inset-top, 0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);color:var(--bone);
    font-family:"Avenir Next Condensed","Futura",-apple-system,"Segoe UI",system-ui,sans-serif;
    touch-action:manipulation;-webkit-user-select:none;user-select:none}
  #gl{position:fixed;inset:0;width:100%;height:100%;display:block;background:#000}
  #three{position:fixed;inset:0;width:100%;height:100%;display:block;pointer-events:none;z-index:2}
  video{position:fixed;width:2px;height:2px;opacity:.01;pointer-events:none;top:0;left:0}

  /* ---- top bar ---- */
  .top{position:fixed;top:calc(var(--safe-t) + 10px);left:12px;right:12px;display:flex;
    align-items:center;gap:8px;z-index:5;pointer-events:none}
  .badge{pointer-events:auto;display:flex;align-items:center;gap:6px;
    background:rgba(23,12,27,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid rgba(246,239,230,.14);border-radius:999px;padding:6px 12px;
    font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
  .dot{width:7px;height:7px;border-radius:50%;background:#7a5f2a;transition:background .3s, box-shadow .3s}
  .dot.on{background:var(--marigold);box-shadow:0 0 10px var(--marigold)}
  .spacer{flex:1}
  .iconbtn{pointer-events:auto;width:40px;height:40px;border-radius:50%;border:1px solid rgba(246,239,230,.14);
    background:rgba(23,12,27,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    color:var(--bone);font-size:17px;display:grid;place-items:center;cursor:pointer}
  .iconbtn:active{transform:scale(.92)}

  /* ---- bottom deck ---- */
  .deck{position:fixed;left:0;right:0;bottom:0;z-index:5;padding-bottom:calc(var(--safe-b) + 10px);
    background:linear-gradient(to top, rgba(23,12,27,.92) 55%, rgba(23,12,27,0));
    padding-top:26px}
  .rail{display:flex;gap:7px;overflow-x:auto;overflow-y:hidden;padding:0 12px 9px;
    scrollbar-width:none;scroll-snap-type:x proximity}
  .rail::-webkit-scrollbar{display:none}
  .rlabel{font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:rgba(246,239,230,.3);
    padding:0 14px 3px;pointer-events:none}
  .chip{flex:0 0 auto;scroll-snap-align:center;border:1px solid rgba(246,239,230,.16);
    background:rgba(246,239,230,.06);color:var(--bone);border-radius:13px;padding:7px 12px 8px;
    font:inherit;font-size:12px;letter-spacing:.09em;text-transform:uppercase;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:2px;min-width:60px;line-height:1;
    transition:background .15s,border-color .15s,transform .12s}
  .chip .gl{font-size:17px;line-height:1.1;font-family:-apple-system,"Segoe UI Emoji",system-ui}
  .chip:active{transform:scale(.94)}
  .chip[aria-pressed="true"]{background:var(--marigold);border-color:var(--marigold);color:var(--ink);font-weight:600}
  #masks .chip[aria-pressed="true"]{background:var(--cyan);border-color:var(--cyan);color:var(--ink)}

  .bar{display:flex;align-items:center;justify-content:space-between;padding:6px 24px 2px}
  .shutter{width:74px;height:74px;border-radius:50%;border:4px solid var(--bone);background:transparent;
    display:grid;place-items:center;cursor:pointer;padding:0}
  .shutter i{display:block;width:58px;height:58px;border-radius:50%;background:var(--bone);
    transition:transform .1s}
  .shutter:active i{transform:scale(.86)}
  .side{width:52px;text-align:center;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
  .side b{display:block;font-size:19px;color:var(--bone);font-weight:600;letter-spacing:0}

  /* ---- start / error screens ---- */
  .veil{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:26px;
    background:radial-gradient(120% 90% at 50% 12%, var(--plum), var(--ink) 70%)}
  .veil.gone{display:none}
  .card{max-width:340px;text-align:center}
  .card h1{font-size:clamp(42px,15vw,68px);line-height:.88;margin:0 0 14px;letter-spacing:-.02em;
    text-transform:uppercase;font-weight:700;
    background:linear-gradient(100deg,var(--marigold),var(--cyan));-webkit-background-clip:text;
    background-clip:text;color:transparent;transform:scaleY(1.12)}
  .card p{color:var(--dim);font-size:15px;line-height:1.5;margin:0 0 22px;letter-spacing:.01em}
  .go{font:inherit;font-size:15px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;
    background:var(--marigold);color:var(--ink);border:0;border-radius:999px;padding:16px 34px;cursor:pointer}
  .go:active{transform:scale(.96)}
  .fine{margin-top:18px;font-size:11px;color:rgba(246,239,230,.35);letter-spacing:.06em}

  /* ---- saved photo sheet ---- */
  .sheet{position:fixed;inset:0;z-index:30;background:rgba(23,12,27,.94);display:none;
    flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px}
  .sheet.show{display:flex}
  .sheet img{max-width:100%;max-height:66vh;border-radius:14px;border:1px solid rgba(246,239,230,.2)}
  .sheet p{margin:0;color:var(--dim);font-size:12px;letter-spacing:.1em;text-transform:uppercase;text-align:center}
  .sheet .row{display:flex;gap:10px}
  .flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:25}
  @media (prefers-reduced-motion:no-preference){
    .flash.fire{animation:fl .32s ease-out}
    @keyframes fl{0%{opacity:.9}100%{opacity:0}}
  }
</style>
</head>
<body>

<canvas id="gl"></canvas>
<canvas id="three"></canvas>
<video id="vid" playsinline webkit-playsinline muted autoplay
       disablepictureinpicture disableremoteplayback x-webkit-airplay="deny"
       preload="none" tabindex="-1" aria-hidden="true"></video>
<div class="flash" id="flash"></div>

<div class="top">
  <div class="badge"><span class="dot" id="dot"></span><span id="status">no face</span></div>
  <span class="spacer"></span>
  <button class="iconbtn" id="flip" title="Switch camera">⇄</button>
</div>

<div class="deck">
  <div class="rlabel">3D Characters</div>
  <div class="rail" id="masks"></div>
  <div class="rlabel">Warps</div>
  <div class="rail" id="warps"></div>
  <div class="bar">
    <span class="side">fps<b id="fps">–</b></span>
    <button class="shutter" id="shot" aria-label="Take photo"><i></i></button>
    <span class="side" id="modeName">normal</span>
  </div>
</div>

<div class="veil" id="veil">
  <div class="card">
    <h1>Fun<br>house</h1>
    <p>Live camera warps &amp; real-3D character masks that track your face in 3D. Everything runs on-device.</p>
    <button class="go" id="start">Turn on camera</button>
    <div class="fine" id="fine">Needs HTTPS · front camera · sound off</div>
  </div>
</div>

<div class="sheet" id="sheet">
  <img id="shotImg" alt="Your photo">
  <p>Press and hold the picture to save it to Photos</p>
  <div class="row">
    <button class="go" id="shareBtn" style="background:var(--cyan)">Share</button>
    <button class="go" id="closeSheet" style="background:transparent;color:var(--bone);border:1px solid rgba(246,239,230,.3)">Back</button>
  </div>
</div>

<script type="module">
/* ============================================================
   Funhouse — WebGL1 face-tracked camera warps + real 3D
   character masks, single file.

   Face landmarks: MediaPipe Tasks Vision (lazy, optional).
   3D layer: three.js. The 468 landmarks (incl. their z depth)
   are turned into a full head pose — position, orientation
   (pitch / yaw / roll) and scale — and procedurally-built
   character rigs are rendered on top with PBR materials,
   lighting and a real depth buffer. A hidden head occluder
   makes accessories wrap around the head.
   ============================================================ */

const V  = document.getElementById('vid');
const C  = document.getElementById('gl');
const TC = document.getElementById('three');
const statusEl  = document.getElementById('status');
const dotEl     = document.getElementById('dot');
const fpsEl     = document.getElementById('fps');
const modeNameEl= document.getElementById('modeName');

const WARPS = [
  { id:0,  g:'🙂', n:'none'    },
  { id:1,  g:'🎈', n:'balloon' },
  { id:2,  g:'🫧', n:'shrink'  },
  { id:3,  g:'👀', n:'bug eyes'},
  { id:4,  g:'😮', n:'big mouth'},
  { id:5,  g:'👽', n:'alien'   },
  { id:6,  g:'🟢', n:'squash'  },
  { id:7,  g:'🥖', n:'stretch' },
  { id:8,  g:'🌀', n:'swirl'   },
  { id:9,  g:'〰️', n:'ripple'  },
  { id:10, g:'🤪', n:'googly'  },
  { id:11, g:'🥔', n:'potato'  },
  { id:12, g:'🪞', n:'twin'    },
  { id:13, g:'🐽', n:'snout'   },
  { id:14, g:'🐹', n:'cheeks'  },
  { id:15, g:'🍦', n:'melt'    },
  { id:16, g:'🔮', n:'fisheye' },
  { id:17, g:'🧊', n:'pixel'   },
  { id:18, g:'❄️', n:'kaleido' },
  { id:19, g:'🍮', n:'jelly'   },
  { id:20, g:'🤏', n:'pinch'   },
  { id:21, g:'🥊', n:'punch'   },
  { id:22, g:'🌪️', n:'twist'   },
  { id:23, g:'🔃', n:'flip mir'},
  { id:24, g:'💥', n:'spikes'  },
  { id:25, g:'↔️', n:'wide'    },
  { id:26, g:'↕️', n:'tall'    },
  { id:27, g:'😵', n:'dizzy'   },
];

/* 3D character rigs — id 0 = off */
const MASKS = [
  { id:0,  g:'🚫', n:'none'      },
  { id:1,  g:'🦄', n:'unicorn'   },
  { id:2,  g:'🐸', n:'frog'      },
  { id:3,  g:'🐶', n:'dog'       },
  { id:4,  g:'🐱', n:'cat'       },
  { id:5,  g:'🐰', n:'bunny'     },
  { id:6,  g:'🐷', n:'pig'       },
  { id:7,  g:'🐻', n:'bear'      },
  { id:8,  g:'🦌', n:'reindeer'  },
  { id:9,  g:'😈', n:'devil'     },
  { id:10, g:'👑', n:'crown'     },
  { id:11, g:'😎', n:'shades'    },
  { id:12, g:'🤡', n:'clown'     },
  { id:13, g:'😇', n:'halo'      },
  { id:14, g:'🎩', n:'gentleman' },
  { id:15, g:'🥳', n:'party'     },
  { id:16, g:'🌸', n:'flowers'   },
  { id:17, g:'😍', n:'heart eyes'},
  { id:18, g:'🤩', n:'star eyes' },
];

const state = { warp:1, mask:0, facing:'user', mirror:true };

/* ---------- chips ---------- */
function buildRail(el, items, key){
  items.forEach(it=>{
    const b = document.createElement('button');
    b.className='chip'; b.type='button';
    b.setAttribute('aria-pressed', String(state[key]===it.id));
    b.innerHTML = `<span class="gl">${it.g}</span><span>${it.n}</span>`;
    b.onclick = ()=>{
      state[key]=it.id;
      [...el.children].forEach((c,i)=>c.setAttribute('aria-pressed', String(items[i].id===it.id)));
      if(key==='warp') modeNameEl.textContent = it.n;
      if(key==='mask' && it.id) loadThree();
      b.scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});
    };
    el.appendChild(b);
  });
}
buildRail(document.getElementById('warps'), WARPS, 'warp');
buildRail(document.getElementById('masks'), MASKS, 'mask');
modeNameEl.textContent = WARPS[state.warp].n;

/* ---------- GL (warps) ---------- */
const gl = C.getContext('webgl', {alpha:false, antialias:false, preserveDrawingBuffer:false, powerPreference:'high-performance'});
if(!gl){ fail('This browser has no WebGL. Try Safari or Chrome.'); }

const VS = `
attribute vec2 aPos;
varying vec2 vScr;
void main(){
  vScr = vec2(aPos.x*0.5+0.5, 0.5-aPos.y*0.5);   /* y down, like the video */
  gl_Position = vec4(aPos,0.0,1.0);
}`;

const FS = `
precision highp float;
varying vec2 vScr;
uniform sampler2D uTex;
uniform vec2  uCover;
uniform float uAsp;
uniform float uMirror;
uniform float uTime;
uniform int   uWarp;
uniform vec3  uEyeA;
uniform vec3  uEyeB;
uniform vec3  uMouth;
uniform vec3  uFace;
uniform float uHas;

vec2 A(vec2 d){ return d*vec2(uAsp,1.0); }
vec2 U(vec2 d){ return d/vec2(uAsp,1.0); }

vec2 bulge(vec2 uv, vec2 c, float r, float p){
  vec2 d = A(uv-c); float l = length(d);
  if(l >= r || l < 1e-6) return uv;
  return c + U(normalize(d) * pow(l/r, p) * r);
}
vec2 scaleAt(vec2 uv, vec2 c, vec2 k, float r){
  vec2 d = A(uv-c);
  float w = 1.0 - smoothstep(r*0.45, r, length(d));
  return c + U(mix(d, d/k, w));
}
vec2 swirl(vec2 uv, vec2 c, float r, float amt){
  vec2 d = A(uv-c); float l = length(d);
  if(l >= r) return uv;
  float a = amt * pow(1.0 - l/r, 2.0);
  float s = sin(a), co = cos(a);
  return c + U(vec2(d.x*co - d.y*s, d.x*s + d.y*co));
}
float hash(float x){ return fract(sin(x*127.1)*43758.5453); }
vec3 grab(vec2 uv){ return texture2D(uTex, clamp(uv,0.001,0.999)).rgb; }

void main(){
  vec2 uv = (vScr-0.5)*uCover + 0.5;
  if(uMirror > 0.5) uv.x = 1.0 - uv.x;

  vec2 c = uFace.xy; float R = uFace.z;
  float t = uTime;

  if(uWarp==1)  uv = bulge(uv, c, R*1.45, 2.15);
  else if(uWarp==2)  uv = bulge(uv, c, R*1.9, 0.48);
  else if(uWarp==3){ uv = bulge(uv, uEyeA.xy, uEyeA.z*2.6, 2.7);
                     uv = bulge(uv, uEyeB.xy, uEyeB.z*2.6, 2.7); }
  else if(uWarp==4){ uv = scaleAt(uv, uMouth.xy, vec2(1.55,2.3), uMouth.z*3.4); }
  else if(uWarp==5){
    float y = clamp((uv.y-(c.y-R))/(2.0*R), 0.0, 1.0);
    float k = mix(1.75, 0.5, y*y);
    vec2 d = A(uv-c);
    float w = 1.0 - smoothstep(R*0.7, R*1.5, length(d));
    d.x = mix(d.x, d.x/k, w);
    uv = c + U(d);
    uv = bulge(uv, c - vec2(0.0, R*0.45), R*0.9, 1.5);
  }
  else if(uWarp==6)  uv = scaleAt(uv, c, vec2(1.7,0.72), R*1.7);
  else if(uWarp==7)  uv = scaleAt(uv, c, vec2(0.62,1.85), R*1.9);
  else if(uWarp==8)  uv = swirl(uv, c, R*1.5, 2.6);
  else if(uWarp==9)  uv += vec2(0.016*sin(uv.y*26.0 + t*3.4), 0.010*sin(uv.x*20.0 - t*2.6));
  else if(uWarp==10){
    float w1 = 2.2 + 0.9*sin(t*5.0);
    float w2 = 2.2 + 0.9*sin(t*5.0 + 2.1);
    vec2 j1 = vec2(sin(t*3.1), cos(t*2.3))*uEyeA.z*0.35;
    vec2 j2 = vec2(cos(t*2.7), sin(t*3.5))*uEyeB.z*0.35;
    uv = bulge(uv, uEyeA.xy + U(j1), uEyeA.z*2.4, w1);
    uv = bulge(uv, uEyeB.xy + U(j2), uEyeB.z*2.4, w2);
    uv = scaleAt(uv, uMouth.xy, vec2(1.2, 1.5+0.5*sin(t*4.0)), uMouth.z*3.0);
  }
  else if(uWarp==11){
    for(int i=0;i<4;i++){
      float f = float(i);
      float a = t*0.6 + f*1.9;
      vec2 p = c + U(vec2(cos(a), sin(a*1.3))*R*0.55);
      uv = bulge(uv, p, R*(0.5+0.1*f), 1.9);
    }
  }
  else if(uWarp==12){
    float d = uv.x - c.x;
    uv.x = c.x - abs(d);
    uv = bulge(uv, c, R*1.2, 1.35);
  }
  else if(uWarp==13){
    vec2 nose = mix(uMouth.xy, c, 0.55);
    uv = bulge(uv, nose, R*0.55, 2.9);
  }
  else if(uWarp==14){
    vec2 l = c + U(vec2(-R*0.85, R*0.25));
    vec2 r2 = c + U(vec2( R*0.85, R*0.25));
    uv = bulge(uv, l, R*0.8, 2.4);
    uv = bulge(uv, r2, R*0.8, 2.4);
  }
  else if(uWarp==15){
    float drip = hash(floor(uv.x*46.0));
    float below = smoothstep(c.y - R*0.1, c.y + R*1.1, uv.y);
    uv.y -= below * drip * (0.10 + 0.03*sin(t*1.6 + drip*20.0));
  }
  else if(uWarp==16) uv = bulge(uv, vec2(0.5), 1.35, 2.4);
  else if(uWarp==17){
    float d = length(A(uv-c));
    float w = 1.0 - smoothstep(R*0.9, R*1.25, d);
    float px = mix(0.0012, 0.030, w);
    uv = floor(uv/px)*px + px*0.5;
  }
  else if(uWarp==18){
    vec2 d = A(uv-c);
    float a = atan(d.y, d.x), l = length(d);
    float seg = 3.14159/3.0;
    a = abs(mod(a, seg*2.0) - seg);
    uv = c + U(vec2(cos(a), sin(a))*l);
  }
  else if(uWarp==19) uv += vec2(0.010*sin(uv.y*7.0 + t*2.2), 0.010*sin(uv.x*7.0 + t*1.9));
  else if(uWarp==20) uv = bulge(uv, vec2(0.5), 1.7, 0.65);
  else if(uWarp==21){ float z = 1.0 + 0.14*sin(t*3.2); uv = (uv-0.5)/z + 0.5; }
  else if(uWarp==22) uv = swirl(uv, vec2(0.5), 1.7, 1.4*sin(t*0.6));
  else if(uWarp==23) uv.y = c.y - abs(uv.y - c.y);
  else if(uWarp==24){
    vec2 d = A(uv-c); float a = atan(d.y, d.x), l = length(d);
    if(l < R*1.7){ l *= 1.0 + 0.10*sin(a*12.0 + t*2.0); uv = c + U(vec2(cos(a), sin(a))*l); }
  }
  else if(uWarp==25) uv = scaleAt(uv, c, vec2(1.7,1.0), R*1.9);
  else if(uWarp==26) uv = scaleAt(uv, c, vec2(1.0,1.7), R*1.9);
  else if(uWarp==27) uv = swirl(uv, c, R*1.6, 2.0*sin(t*1.2));

  vec3 col = grab(uv);
  float vig = 1.0 - 0.22*pow(length((vScr-0.5)*vec2(1.0,1.1))*1.45, 2.0);
  col *= clamp(vig, 0.0, 1.0);
  gl_FragColor = vec4(clamp(col,0.0,1.0), 1.0);
}`;

function sh(type, src){
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS));
gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
gl.bindAttribLocation(prog, 0, 'aPos');
gl.linkProgram(prog);
if(!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

const tex = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, tex);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

const U = n => gl.getUniformLocation(prog, n);
const uni = {
  cover:U('uCover'), asp:U('uAsp'), mirror:U('uMirror'), time:U('uTime'),
  warp:U('uWarp'), eyeA:U('uEyeA'), eyeB:U('uEyeB'),
  mouth:U('uMouth'), face:U('uFace'), has:U('uHas')
};

/* ---------- camera ---------- */
let stream = null;
function keepInline(){
  V.playsInline = true; V.controls = false; V.muted = true; V.volume = 0;
  V.disablePictureInPicture = true;
  if('disableRemotePlayback' in V) V.disableRemotePlayback = true;
  V.removeAttribute('controls');
}
V.addEventListener('webkitbeginfullscreen', ()=>{ if(V.webkitExitFullscreen) V.webkitExitFullscreen(); });
V.addEventListener('webkitpresentationmodechanged', ()=>{
  if(V.webkitPresentationMode && V.webkitPresentationMode !== 'inline' && V.webkitSetPresentationMode)
    V.webkitSetPresentationMode('inline');
});

/* ---------- face landmarks (optional) ---------- */
let landmarker = null, lastSeen = 0;
async function loadLandmarker(){
  statusEl.textContent = 'loading tracker';
  try{
    const V0 = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
    const { FilesetResolver, FaceLandmarker } = await import(V0);
    const files = await FilesetResolver.forVisionTasks(V0 + '/wasm');
    landmarker = await FaceLandmarker.createFromOptions(files, {
      baseOptions:{
        modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',
        delegate:'GPU'
      },
      runningMode:'VIDEO', numFaces:1,
      outputFaceBlendshapes:false, outputFacialTransformationMatrixes:false
    });
    statusEl.textContent = 'looking';
  }catch(err){
    console.warn('landmarker unavailable', err);
    statusEl.textContent = 'centre lock';
  }
}

/* smoothed face geometry (for the 2D warp shader), video-image uv */
const F = { cx:0.5, cy:0.44, r:0.30, ax:0.44, ay:0.40, ar:0.05, bx:0.56, by:0.40, br:0.05, mx:0.5, my:0.60, mr:0.06, has:0 };
const avg = (lm, idx) => {
  let x=0, y=0;
  for(const i of idx){ x += lm[i].x; y += lm[i].y; }
  return [x/idx.length, y/idx.length];
};
const EYE_A = [33,133,159,145,153,157];
const EYE_B = [362,263,386,374,380,385];
const MOUTH = [13,14,61,291,78,308];

/* raw landmark subset used to build the 3D head pose */
const rawPose = { has:0, n:null, chin:null, top:null, lc:null, rc:null };

const T = Object.assign({}, F);
let lastDetect = 0, lastTs = -1;

function defaultTarget(aspect){
  T.cx=0.5; T.cy=0.44; T.r=0.30;
  T.ax=0.5-0.10/aspect; T.ay=0.38; T.ar=0.055;
  T.bx=0.5+0.10/aspect; T.by=0.38; T.br=0.055;
  T.mx=0.5; T.my=0.58; T.mr=0.065; T.has=0;
}

function trackFace(now, aspect){
  if(landmarker && now - lastDetect > 32 && V.readyState >= 2){
    lastDetect = now;
    const ts = Math.max(now, lastTs + 1); lastTs = ts;
    let hit = null;
    try{
      const res = landmarker.detectForVideo(V, ts);
      if(res && res.faceLandmarks && res.faceLandmarks.length) hit = res.faceLandmarks[0];
    }catch(e){ /* keep the previous target */ }

    if(hit){
      lastSeen = now;
      let minX=1, maxX=0, minY=1, maxY=0;
      for(const p of hit){
        if(p.x<minX)minX=p.x; if(p.x>maxX)maxX=p.x;
        if(p.y<minY)minY=p.y; if(p.y>maxY)maxY=p.y;
      }
      const [ax,ay] = avg(hit, EYE_A), [bx,by] = avg(hit, EYE_B), [mx,my] = avg(hit, MOUTH);
      const eyeR = Math.max(0.02, Math.hypot((bx-ax)*aspect, by-ay)*0.30);
      T.cx=(minX+maxX)/2; T.cy=(minY+maxY)/2;
      T.r = 0.5*Math.max((maxX-minX)*aspect, (maxY-minY))*1.05;
      T.ax=ax; T.ay=ay; T.ar=eyeR;
      T.bx=bx; T.by=by; T.br=eyeR;
      T.mx=mx; T.my=my; T.mr=eyeR*1.15;
      T.has=1;
      const gp = i => [hit[i].x, hit[i].y, hit[i].z];
      rawPose.n=gp(1); rawPose.chin=gp(152); rawPose.top=gp(10); rawPose.lc=gp(234); rawPose.rc=gp(454);
      rawPose.has = 1;
    } else if(now - lastSeen > 600){
      defaultTarget(aspect);
      rawPose.has = 0;
    }
  } else if(!landmarker){
    defaultTarget(aspect);
    rawPose.has = 0;
  }

  const k = 0.30;
  for(const key in F) F[key] += (T[key] - F[key]) * k;

  const live = F.has > 0.5;
  dotEl.classList.toggle('on', live);
  const label = landmarker ? (live ? 'face locked' : 'looking') : 'centre lock';
  if(statusEl.textContent !== label) statusEl.textContent = label;
}

/* ============================================================
   three.js — real 3D character layer
   ============================================================ */
let THREE=null, renderer=null, scene=null, camera=null, threeLoading=false, threeReady=false;
const models = {};                 /* id -> THREE.Group (built lazily) */
let smPos, smQuat, smScale=0, poseInit=false;

async function loadThree(){
  if(threeReady || threeLoading) return;
  threeLoading = true;
  try{
    THREE = await import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js');
    renderer = new THREE.WebGLRenderer({ canvas:TC, alpha:true, antialias:true, preserveDrawingBuffer:true });
    renderer.setPixelRatio(1);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;

    scene = new THREE.Scene();
    camera = new THREE.OrthographicCamera(0, C.width, 0, C.height, -4000, 4000);
    camera.position.z = 1000;

    const hemi = new THREE.HemisphereLight(0xffffff, 0x2a2340, 1.15); scene.add(hemi);
    const key = new THREE.DirectionalLight(0xffffff, 1.5); key.position.set(-0.5,-1.0,1.2).multiplyScalar(1000); scene.add(key);
    const rim = new THREE.DirectionalLight(0x9fc6ff, 0.55); rim.position.set(0.7,-0.1,0.6).multiplyScalar(1000); scene.add(rim);

    smPos = new THREE.Vector3(); smQuat = new THREE.Quaternion();
    resizeThree();
    threeReady = true;
  }catch(e){
    console.warn('three.js unavailable', e);
    statusEl.textContent = '3d unavailable';
  }finally{
    threeLoading = false;
  }
}

function resizeThree(){
  if(!renderer) return;
  renderer.setSize(C.width, C.height, false);
  camera.right = C.width; camera.bottom = C.height;
  camera.updateProjectionMatrix();
}

/* ---- procedural character rigs (units of face-width, origin at nose tip;
        +x = subject right, +y = up, +z = out of face toward camera) ---- */
function buildModel(id){
  const T = THREE, g = new T.Group();
  const SPH=new T.SphereGeometry(1,28,20), CON=new T.ConeGeometry(1,1,26),
        CYL=new T.CylinderGeometry(1,1,1,26), TOR=new T.TorusGeometry(1,0.28,16,44),
        BOX=new T.BoxGeometry(1,1,1);
  const CAP = T.CapsuleGeometry ? new T.CapsuleGeometry(0.5,1,8,16) : CYL;
  const mat=(c,o)=>new T.MeshStandardMaterial(Object.assign({color:c,roughness:0.55,metalness:0.0},o||{}));
  const gold=mat(0xffcf33,{metalness:0.95,roughness:0.22}),
        white=mat(0xf6eff5), pink=mat(0xff9ec4), black=mat(0x161616,{roughness:0.3}),
        red=mat(0xd83a3a,{roughness:0.4});
  const add=(geo,m,p,r,s)=>{ const me=new T.Mesh(geo,m);
    if(p)me.position.set(p[0],p[1],p[2]); if(r)me.rotation.set(r[0],r[1],r[2]);
    if(s!=null){ Array.isArray(s)?me.scale.set(s[0],s[1],s[2]):me.scale.setScalar(s);} g.add(me); return me; };

  /* hidden head occluder so accessories wrap around the head (depth-only) */
  const occ = mat(0x000000); occ.colorWrite = false;
  add(SPH, occ, [0,0.35,-0.35], null, [0.95,1.15,0.95]);

  const ears = (m, x, y, z, rot, s) => add(CON, m, [x,y,z], rot, s);

  /* a thin cylinder grown FROM a pivot point outward along dir (e.g. a whisker) */
  const spoke = (m, pivot, dir, len, rad) => {
    const me = new T.Mesh(CYL, m);
    me.scale.set(rad, len, rad);
    me.position.set(0, len/2, 0);          /* extends along +Y from the origin */
    const h = new T.Group();
    h.add(me);
    h.position.set(pivot[0], pivot[1], pivot[2]);
    h.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),
      new T.Vector3(dir[0], dir[1], dir[2]).normalize());
    g.add(h); return h;
  };

  switch(id){
    case 1: { /* unicorn */
      add(CON, gold, [0,1.25,0.35], [0.28,0,0], [0.14,0.85,0.14]);
      const cols=[0xff5d8f,0xff9f45,0xffd23f,0x5ec26a,0x4d96ff,0x9b5de5];
      for(let i=0;i<cols.length;i++) add(SPH, mat(cols[i]), [(-0.5+i*0.2),1.02+0.12*Math.sin(i),0.28], null, 0.11);
      for(const s of [-1,1]){
        ears(white, s*0.52,1.02,0.12,[0.2,0,-s*0.15],[0.17,0.4,0.11]);
        ears(pink,  s*0.52,1.05,0.2,[0.2,0,-s*0.15],[0.09,0.24,0.06]);
      }
      break;
    }
    case 2: { /* frog */
      const green=mat(0x5ec26a,{roughness:0.5});
      for(const s of [-1,1]){
        add(SPH, green, [s*0.55,1.12,0.15], null, 0.44);
        add(SPH, white, [s*0.55,1.24,0.44], null, 0.24);
        add(SPH, black, [s*0.55,1.27,0.62], null, 0.12);
      }
      break;
    }
    case 3: { /* dog */
      const brown=mat(0x8a5a2b), tan=mat(0xb9895a);
      for(const s of [-1,1]) add(CAP, brown, [s*0.92,0.35,-0.05], [0,0,s*0.18], [0.26,0.62,0.34]);
      add(SPH, black, [0,0.05,0.5], null, [0.22,0.17,0.16]);
      add(SPH, tan, [0,-0.15,0.42], null, [0.34,0.3,0.3]);
      break;
    }
    case 4: { /* cat */
      const gray=mat(0x8a8f97);
      for(const s of [-1,1]){
        ears(gray, s*0.5,1.02,0.02,null,[0.28,0.5,0.14]);
        ears(pink, s*0.5,1.0,0.09,null,[0.15,0.28,0.08]);
      }
      add(SPH, pink, [0,0.16,0.42], null, [0.1,0.08,0.08]);
      const wm = mat(0xf2f2f2);
      /* three whiskers per side, fanned out from the muzzle */
      for(const s of [-1,1]) for(let i=-1;i<=1;i++)
        spoke(wm, [s*0.16,0.05,0.46], [s*1.0, i*0.45, 0.14], 0.62, 0.009);
      break;
    }
    case 5: { /* bunny */
      for(const s of [-1,1]){
        add(CAP, white, [s*0.34,1.55,0.0], [0,0,s*0.05], [0.24,0.62,0.24]);
        add(CAP, pink,  [s*0.34,1.6,0.12], [0,0,s*0.05], [0.12,0.5,0.12]);
      }
      add(SPH, pink, [0,0.16,0.42], null, [0.1,0.08,0.08]);
      const bw = mat(0xf2f2f2);
      for(const s of [-1,1]) for(let i=-1;i<=1;i++)
        spoke(bw, [s*0.12,0.06,0.46], [s*1.0, i*0.4, 0.14], 0.5, 0.008);
      break;
    }
    case 6: { /* pig */
      const pk=mat(0xff9bb3);
      add(CYL, pk, [0,0.05,0.5], [Math.PI/2,0,0], [0.4,0.24,0.4]);
      for(const s of [-1,1]) add(SPH, mat(0xe56f90), [s*0.16,0.05,0.66], null, [0.08,0.11,0.06]);
      for(const s of [-1,1]) ears(pk, s*0.5,0.98,0.05,[0.4,0,s*0.2],[0.24,0.32,0.14]);
      break;
    }
    case 7: { /* bear */
      const br=mat(0x6f4a2b), lt=mat(0xcaa06f);
      for(const s of [-1,1]) add(SPH, br, [s*0.62,0.98,0.0], null, 0.32);
      add(SPH, lt, [0,-0.02,0.42], null, [0.4,0.32,0.3]);
      add(SPH, black, [0,0.12,0.6], null, [0.16,0.12,0.12]);
      break;
    }
    case 8: { /* reindeer */
      const br=mat(0x7a4a1e);
      for(const s of [-1,1]){
        add(CYL, br, [s*0.42,1.15,0], [0,0,-s*0.5], [0.06,0.95,0.06]);
        add(CYL, br, [s*0.62,1.4,0], [0,0,-s*0.9], [0.045,0.5,0.045]);
        add(CYL, br, [s*0.72,1.75,0], [0,0,-s*0.6], [0.04,0.45,0.04]);
      }
      add(SPH, red, [0,0.05,0.55], null, 0.2);
      break;
    }
    case 9: { /* devil */
      for(const s of [-1,1]) add(CON, red, [s*0.4,1.02,0.12], [0.25,0,-s*0.35], [0.15,0.55,0.15]);
      break;
    }
    case 10: { /* crown */
      add(TOR, gold, [0,1.12,-0.1], [Math.PI/2,0,0], [0.72,0.72,0.5]);
      const gems=[0xff5d8f,0x4d96ff,0x5ec26a,0xff9f45,0x9b5de5];
      for(let i=0;i<5;i++){ const a=(i-2)*0.5;
        add(CON, gold, [Math.sin(a)*0.72,1.32,Math.cos(a)*0.5], [0.1,-a,0], [0.12,0.4,0.12]);
        add(SPH, mat(gems[i],{metalness:0.3,roughness:0.2}), [Math.sin(a)*0.72,1.12,Math.cos(a)*0.55], null, 0.09);
      }
      break;
    }
    case 11: { /* shades */
      const glass=mat(0x0a0a0a,{metalness:0.6,roughness:0.15}), frame=mat(0x111);
      for(const s of [-1,1]) add(BOX, glass, [s*0.4,0.34,0.45], [0,0,0], [0.34,0.22,0.06]);
      add(BOX, frame, [0,0.34,0.47], null, [0.22,0.05,0.05]);
      for(const s of [-1,1]) add(BOX, frame, [s*0.62,0.36,0.2], [0,0.5*s,0], [0.4,0.05,0.05]);
      break;
    }
    case 12: { /* clown */
      add(SPH, mat(0xff3b3b), [0,0.1,0.55], null, 0.24);
      for(const s of [-1,1]){ add(SPH, red, [s*0.95,0.85,-0.1], null, 0.42);
        add(SPH, mat(0x4d96ff), [s*1.1,1.05,-0.1], null, 0.3); }
      break;
    }
    case 13: { /* halo */
      const h=mat(0xffe27a,{emissive:0xffcf33,emissiveIntensity:0.9,metalness:0.7,roughness:0.3});
      add(TOR, h, [0,1.85,-0.25], [Math.PI/2*0.82,0,0], [0.62,0.62,0.62]);
      break;
    }
    case 14: { /* gentleman */
      const blk=mat(0x141414,{roughness:0.4});
      add(CYL, blk, [0,1.2,0], null, [0.98,0.06,0.98]);
      add(CYL, blk, [0,1.62,0], null, [0.6,0.82,0.6]);
      add(CYL, mat(0x7a1f2b), [0,1.28,0], null, [0.63,0.12,0.63]);
      add(TOR, mat(0x241a12), [0,-0.42,0.44], [Math.PI/2,0,0], [0.3,0.16,0.14]);
      break;
    }
    case 15: { /* party */
      const cone=mat(0xff5d8f);
      add(CON, cone, [0.12,1.5,0], [0,0,-0.16], [0.5,1.1,0.5]);
      for(let i=0;i<5;i++) add(TOR, mat([0xffd23f,0x4d96ff,0x5ec26a,0xff9f45,0x9b5de5][i]),
        [0.12+Math.sin(i)*0.05,1.05+i*0.2,0], [Math.PI/2,0,0], [0.5-i*0.08,0.5-i*0.08,0.4]);
      add(SPH, white, [0.12,2.06,0], null, 0.16);
      break;
    }
    case 16: { /* flower crown */
      const petal=mat(0xff7ab0), petal2=mat(0xffd23f), ctr=mat(0xffe27a);
      for(let i=-2;i<=2;i++){ const fg=new T.Group();
        const pm = (i%2)?petal2:petal;
        for(let k=0;k<5;k++){ const a=k/5*Math.PI*2;
          const m=new T.Mesh(SPH,pm); m.position.set(Math.cos(a)*0.13,Math.sin(a)*0.13,0); m.scale.set(0.1,0.1,0.05); fg.add(m); }
        const cm=new T.Mesh(SPH,ctr); cm.scale.setScalar(0.08); fg.add(cm);
        fg.position.set(i*0.4,1.12-Math.abs(i)*0.05,0.32*Math.cos(i*0.5)+0.12);
        g.add(fg);
      }
      break;
    }
    case 17: { /* heart eyes */
      const geo=heartGeo(T), hm=mat(0xff3b6b,{emissive:0x661022,emissiveIntensity:0.5,roughness:0.35});
      for(const s of [-1,1]) add(geo, hm, [s*0.42,0.4,0.5], [0,0,0], 0.5);
      break;
    }
    case 18: { /* star eyes */
      const geo=starGeo(T), sm=mat(0xffd23f,{emissive:0x6b5200,emissiveIntensity:0.6,roughness:0.3,metalness:0.2});
      for(const s of [-1,1]) add(geo, sm, [s*0.42,0.4,0.5], [0,0,0], 0.5);
      break;
    }
  }
  return g;
}

function heartGeo(T){
  const s=new T.Shape();
  s.moveTo(0,0.25);
  s.bezierCurveTo(0,0.35,-0.12,0.5,-0.28,0.5);
  s.bezierCurveTo(-0.6,0.5,-0.6,0.08,-0.28,-0.15);
  s.lineTo(0,-0.45);
  s.lineTo(0.28,-0.15);
  s.bezierCurveTo(0.6,0.08,0.6,0.5,0.28,0.5);
  s.bezierCurveTo(0.12,0.5,0,0.35,0,0.25);
  return new T.ExtrudeGeometry(s,{depth:0.22,bevelEnabled:true,bevelThickness:0.05,bevelSize:0.05,bevelSegments:2});
}
function starGeo(T){
  const s=new T.Shape();
  for(let i=0;i<10;i++){ const r=i%2?0.24:0.55, a=Math.PI/2 + i*Math.PI/5;
    const x=Math.cos(a)*r, y=Math.sin(a)*r; i?s.lineTo(x,y):s.moveTo(x,y); }
  s.closePath();
  return new T.ExtrudeGeometry(s,{depth:0.2,bevelEnabled:true,bevelThickness:0.05,bevelSize:0.05,bevelSegments:2});
}

/* build a smoothed 3D head pose target from the raw landmarks */
function computeTarget(sx, sy){
  const W=C.width, H=C.height, mir=state.mirror;
  const mp = p => {
    const ux = mir ? 1-p[0] : p[0];
    return new THREE.Vector3(((ux-0.5)/sx + 0.5)*W, ((p[1]-0.5)/sy + 0.5)*H, (-p[2])*W);
  };
  const n=mp(rawPose.n), chin=mp(rawPose.chin), top=mp(rawPose.top), lc=mp(rawPose.lc), rc=mp(rawPose.rc);
  const right=new THREE.Vector3().subVectors(rc,lc);
  const scale=right.length() || (0.2*H);
  right.normalize();
  const up=new THREE.Vector3().subVectors(top,chin).normalize();
  const fwd=new THREE.Vector3().crossVectors(right,up).normalize();
  if(fwd.z<0) fwd.negate();
  right.crossVectors(up,fwd).normalize();
  up.crossVectors(fwd,right).normalize();
  const m=new THREE.Matrix4().makeBasis(right,up,fwd);
  const quat=new THREE.Quaternion().setFromRotationMatrix(m);
  return { pos:n, quat, scale };
}

function updateChar(sx, sy){
  if(!renderer) return;
  if(state.mask && threeReady){
    if(!models[state.mask]){ models[state.mask]=buildModel(state.mask); scene.add(models[state.mask]); }
    for(const k in models) models[k].visible = (+k === state.mask);
    const g = models[state.mask];
    if(rawPose.has){
      const tgt = computeTarget(sx, sy);
      if(!poseInit){ smPos.copy(tgt.pos); smQuat.copy(tgt.quat); smScale=tgt.scale; poseInit=true; }
      else{ smPos.lerp(tgt.pos,0.4); smQuat.slerp(tgt.quat,0.4); smScale += (tgt.scale-smScale)*0.4; }
      g.visible = true;
      g.position.copy(smPos);
      g.quaternion.copy(smQuat);
      g.scale.setScalar(smScale);
    } else {
      g.visible = false;
    }
  } else {
    for(const k in models) models[k].visible = false;
  }
  renderer.render(scene, camera);
}

/* ---------- resize ---------- */
function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  const w = Math.round(innerWidth*dpr), h = Math.round(innerHeight*dpr);
  if(C.width !== w || C.height !== h){ C.width = w; C.height = h; gl.viewport(0,0,w,h); resizeThree(); }
}
addEventListener('resize', resize);
addEventListener('orientationchange', ()=>setTimeout(resize, 250));

/* ---------- render loop ---------- */
let t0 = performance.now(), frames = 0, fpsT = t0, pending = null;
function loop(now){
  requestAnimationFrame(loop);
  if(V.readyState < 2 || !V.videoWidth) return;
  resize();

  const vw = V.videoWidth, vh = V.videoHeight;
  const aspect = vw/vh, canvasAspect = C.width/C.height;
  let sx = 1, sy = 1;
  if(aspect > canvasAspect) sx = canvasAspect/aspect; else sy = aspect/canvasAspect;

  trackFace(now, aspect);

  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, V);

  gl.uniform2f(uni.cover, sx, sy);
  gl.uniform1f(uni.asp, aspect);
  gl.uniform1f(uni.mirror, state.mirror ? 1 : 0);
  gl.uniform1f(uni.time, (now - t0)/1000);
  gl.uniform1i(uni.warp, state.warp);
  gl.uniform3f(uni.eyeA, F.ax, F.ay, F.ar);
  gl.uniform3f(uni.eyeB, F.bx, F.by, F.br);
  gl.uniform3f(uni.mouth, F.mx, F.my, F.mr);
  gl.uniform3f(uni.face, F.cx, F.cy, F.r);
  gl.uniform1f(uni.has, F.has);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  updateChar(sx, sy);

  if(pending){ const fn = pending; pending = null; fn(); }

  frames++;
  if(now - fpsT > 700){ fpsEl.textContent = Math.round(frames*1000/(now-fpsT)); frames=0; fpsT=now; }
}

/* ---------- capture ---------- */
const sheet = document.getElementById('sheet');
const shotImg = document.getElementById('shotImg');
let shotBlob = null;

document.getElementById('shot').onclick = ()=>{
  document.getElementById('flash').classList.remove('fire');
  void document.getElementById('flash').offsetWidth;
  document.getElementById('flash').classList.add('fire');
  /* composite warp + 3D layer in the same frame they were drawn */
  pending = ()=>{
    const tmp = document.createElement('canvas'); tmp.width = C.width; tmp.height = C.height;
    const tc = tmp.getContext('2d');
    tc.drawImage(C, 0, 0);
    if(renderer && state.mask) tc.drawImage(TC, 0, 0);
    tmp.toBlob(b=>{
      shotBlob = b;
      shotImg.src = URL.createObjectURL(b);
      sheet.classList.add('show');
    }, 'image/jpeg', 0.92);
  };
};
document.getElementById('closeSheet').onclick = ()=>{ sheet.classList.remove('show'); };
document.getElementById('shareBtn').onclick = async ()=>{
  if(!shotBlob) return;
  const file = new File([shotBlob], 'funhouse.jpg', {type:'image/jpeg'});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file]}); }catch(e){}
  } else if(!/iP(hone|ad|od)/.test(navigator.userAgent)){
    const a = document.createElement('a');
    a.href = URL.createObjectURL(shotBlob); a.download = 'funhouse.jpg'; a.click();
  } else {
    document.querySelector('.sheet p').textContent = 'Press and hold the picture, then Add to Photos';
  }
};

/* keep the stream alive across app switches on iOS */
document.addEventListener('visibilitychange', ()=>{
  if(!document.hidden && V.srcObject && V.paused) V.play().catch(()=>{});
});
</script>
